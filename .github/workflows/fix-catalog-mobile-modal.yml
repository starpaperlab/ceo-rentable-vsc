name: Fix mobile catalog modal
on:
  push:
    paths:
      - '.github/workflows/fix-catalog-mobile-modal.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile modal
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/pages/Products.jsx')
          s=p.read_text()
          old='''    <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/60 p-2 pt-[env(safe-area-inset-top)] pb-[max(0.5rem,env(safe-area-inset-bottom))] sm:items-center sm:p-4">\n      <Card className="max-h-[calc(100dvh-1rem)] w-full max-w-4xl overflow-y-auto rounded-b-none p-4 sm:max-h-[92dvh] sm:rounded-xl sm:p-6">\n        <div className="flex items-start justify-between gap-4">'''
          new='''    <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/60 sm:items-center sm:p-4">\n      <Card className="flex h-[calc(100dvh-env(safe-area-inset-top))] w-full max-w-4xl flex-col overflow-hidden rounded-none border-0 bg-background sm:h-auto sm:max-h-[92dvh] sm:rounded-xl sm:border">\n        <div className="sticky top-0 z-20 flex shrink-0 items-start justify-between gap-4 border-b bg-background px-4 pb-3 pt-[max(1rem,env(safe-area-inset-top))] sm:p-6 sm:pb-4">'''
          if old not in s: raise SystemExit('modal anchor missing')
          s=s.replace(old,new,1)
          old='''        <fieldset disabled={readOnly} className="mt-5 space-y-5">'''
          new='''        <fieldset disabled={readOnly} className="flex-1 space-y-5 overflow-y-auto px-4 py-5 sm:px-6">'''
          if old not in s: raise SystemExit('fieldset anchor missing')
          s=s.replace(old,new,1)
          old='''        <div className="mt-5 flex justify-end gap-2">\n          <Button variant="outline" onClick={onClose}>{readOnly ? 'Cerrar' : 'Cancelar'}</Button>\n          {!readOnly ? <Button onClick={submit} disabled={saving}>{saving ? <Loader2 className="mr-2 h-4 w-4 animate-spin" /> : null}{initial ? 'Guardar cambios' : 'Crear ítem'}</Button> : null}\n        </div>'''
          new='''        <div className="sticky bottom-0 z-20 flex shrink-0 justify-end gap-2 border-t bg-background px-4 pb-[max(1rem,env(safe-area-inset-bottom))] pt-3 sm:p-6 sm:pt-4">\n          <Button variant="outline" onClick={onClose}>{readOnly ? 'Cerrar' : 'Cancelar'}</Button>\n          {!readOnly ? <Button onClick={submit} disabled={saving}>{saving ? <Loader2 className="mr-2 h-4 w-4 animate-spin" /> : null}{initial ? 'Guardar cambios' : 'Crear ítem'}</Button> : null}\n        </div>'''
          if old not in s: raise SystemExit('footer anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)
      - name: Remove temporary workflow
        shell: python
        run: |
          from pathlib import Path
          Path('.github/workflows/fix-catalog-mobile-modal.yml').unlink()
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make catalog modal usable on mobile" || exit 0
          git push