name: Phase 0.2 validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - audit-fase-0-2-pagos

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security tests
        run: node --test tests/security/*.test.js

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
