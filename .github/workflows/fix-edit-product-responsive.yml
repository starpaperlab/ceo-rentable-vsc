name: Fix edit product responsive
on:
  push:
    paths:
      - '.github/workflows/fix-edit-product-responsive.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch edit product modal
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/Products.jsx')
          s = p.read_text()
          replacements = [
            (
              '        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">',
              '        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 px-2 pb-[max(1rem,env(safe-area-inset-bottom))] pt-[max(3.5rem,env(safe-area-inset-top))] sm:p-4">'
            ),
            (
              '          <motion.div initial={{ opacity: 0, scale: 0.96 }} animate={{ opacity: 1, scale: 1 }} className="w-full max-w-3xl">',
              '          <motion.div initial={{ opacity: 0, scale: 0.96 }} animate={{ opacity: 1, scale: 1 }} className="h-full min-h-0 w-full max-w-3xl sm:h-auto">'
            ),
            (
              '            <Card className="max-h-[calc(100dvh-1rem)] overflow-y-auto rounded-b-none p-4 space-y-5 sm:max-h-[90dvh] sm:rounded-xl sm:p-6">',
              '            <Card className="h-full max-h-full overflow-y-auto rounded-2xl p-4 space-y-5 shadow-2xl sm:h-auto sm:max-h-[90dvh] sm:rounded-xl sm:p-6">'
            ),
            (
              '              <div className="flex items-start justify-between gap-4">\n                <div>\n                  <h3 className="font-semibold text-foreground">Editar producto</h3>',
              '              <div className="sticky top-0 z-20 -mx-4 -mt-4 flex items-start justify-between gap-4 border-b bg-background px-4 pb-4 pt-4 sm:-mx-6 sm:-mt-6 sm:px-6 sm:pt-6">\n                <div>\n                  <h3 className="font-semibold text-foreground">Editar producto</h3>'
            ),
          ]
          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'Missing expected snippet: {old[:120]}')
            s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/fix-edit-product-responsive.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Products.jsx .github/workflows/fix-edit-product-responsive.yml
          git commit -m "fix: make edit product modal responsive on mobile"
          git push
