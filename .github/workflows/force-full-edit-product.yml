name: Force full product edit form
on:
  push:
    paths:
      - '.github/workflows/force-full-edit-product.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force legacy edit handler to full form
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("src/pages/Products.jsx")
          s = p.read_text()
          pattern = re.compile(r"  const openEditProduct = \(product\) => \{.*?\n  \}\n\n  const updateProductForm", re.S)
          replacement = """  const openEditProduct = (product) => {
    if (!canWrite) return
    setEditingState(null)
    setCatalogDialog({ mode: 'edit', item: product })
  }

  const updateProductForm"""
          s2, count = pattern.subn(replacement, s, count=1)
          if count != 1:
            raise SystemExit(f"Expected exactly one legacy edit handler, found {count}")
          p.write_text(s2)
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/force-full-edit-product.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Products.jsx .github/workflows/force-full-edit-product.yml
          git commit -m "fix: force all product edits into full catalog form"
          git push