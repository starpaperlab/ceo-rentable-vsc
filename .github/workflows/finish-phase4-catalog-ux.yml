name: Finish Phase 4 catalog UX
on:
  push:
    paths:
      - '.github/workflows/finish-phase4-catalog-ux.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch catalog thumbnails and mobile spacing
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/pages/Products.jsx')
          s=p.read_text()
          old='''                    <TableCell className="min-w-[220px]">\n                      <div className="space-y-1">\n                        <p className="font-semibold text-sm text-foreground">{product.name}</p>\n                        <div className="flex items-center gap-2 flex-wrap">\n                          {product.sku ? <span className="text-[10px] font-mono text-muted-foreground bg-muted px-1.5 py-0.5 rounded">{product.sku}</span> : null}\n                          {product.category ? <span className="text-[10px] text-muted-foreground bg-muted px-1.5 py-0.5 rounded">{product.category}</span> : null}\n                        </div>\n                      </div>\n                    </TableCell>'''
          new='''                    <TableCell className="min-w-[240px]">\n                      <div className="flex items-center gap-3">\n                        {product.image_url ? (\n                          <img\n                            src={product.image_url}\n                            alt={product.name || 'Producto'}\n                            className="h-14 w-14 shrink-0 rounded-xl border border-border/70 bg-muted object-cover"\n                            loading="lazy"\n                          />\n                        ) : (\n                          <div className="flex h-14 w-14 shrink-0 items-center justify-center rounded-xl border border-dashed border-border bg-muted/40">\n                            <Package className="h-5 w-5 text-muted-foreground/50" />\n                          </div>\n                        )}\n                        <div className="min-w-0 space-y-1">\n                          <p className="truncate font-semibold text-sm text-foreground">{product.name}</p>\n                          <div className="flex items-center gap-2 flex-wrap">\n                            {product.sku ? <span className="text-[10px] font-mono text-muted-foreground bg-muted px-1.5 py-0.5 rounded">{product.sku}</span> : null}\n                            {product.category ? <span className="text-[10px] text-muted-foreground bg-muted px-1.5 py-0.5 rounded">{product.category}</span> : null}\n                          </div>\n                        </div>\n                      </div>\n                    </TableCell>'''
          if old not in s: raise SystemExit('product cell anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)
      - name: Remove temporary workflow
        shell: python
        run: |
          from pathlib import Path
          Path('.github/workflows/finish-phase4-catalog-ux.yml').unlink()
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: show product images in catalog list" || exit 0
          git push