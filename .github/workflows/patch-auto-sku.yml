name: Patch automatic product SKU
on:
  push:
    paths:
      - '.github/workflows/patch-auto-sku.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Products.jsx
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/Products.jsx')
          s=p.read_text()
          old="""  const [form, setForm] = useState(() => buildCatalogForm(initial || {}, costComponents, bundleItems, currency))\n  const update = (field, value) => setForm((current) => ({ ...current, [field]: value }))\n  const cost = getCatalogCost(form, products)\n"""
          new="""  const [form, setForm] = useState(() => buildCatalogForm(initial || {}, costComponents, bundleItems, currency))\n  const update = (field, value) => setForm((current) => ({ ...current, [field]: value }))\n  const existingCatalogSkus = products.map((product) => product?.sku).filter(Boolean)\n  const updateName = (value) => {\n    setForm((current) => ({\n      ...current,\n      name: value,\n      sku: initial?.id ? current.sku : (value.trim() ? generateUniqueSku(value, existingCatalogSkus) : ''),\n    }))\n  }\n  const cost = getCatalogCost(form, products)\n"""
          if old not in s:
              raise SystemExit('state anchor not found')
          s=s.replace(old,new,1)
          old2="""              <div><Label>Nombre *</Label><Input value={form.name} onChange={(event) => update('name', event.target.value)} /></div>\n"""
          new2="""              <div><Label>Nombre *</Label><Input value={form.name} onChange={(event) => updateName(event.target.value)} /></div>\n"""
          if old2 not in s:
              raise SystemExit('name anchor not found')
          s=s.replace(old2,new2,1)
          old3="""              <div><Label>SKU / código</Label><Input value={form.sku} onChange={(event) => update('sku', event.target.value)} /></div>\n"""
          new3="""              <div>\n                <Label>SKU / código</Label>\n                <Input value={form.sku} readOnly={!initial?.id} onChange={(event) => update('sku', event.target.value)} className={!initial?.id ? 'bg-muted/40' : ''} />\n                {!initial?.id ? <p className=\"mt-1 text-[11px] text-muted-foreground\">Se genera automáticamente al escribir el nombre.</p> : null}\n              </div>\n"""
          if old3 not in s:
              raise SystemExit('sku anchor not found')
          s=s.replace(old3,new3,1)
          p.write_text(s)
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/patch-auto-sku.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/Products.jsx .github/workflows/patch-auto-sku.yml
          git commit -m 'feat: generate product SKU automatically'
          git push
