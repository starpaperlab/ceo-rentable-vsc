name: Wire product image uploader

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-product-image-upload.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Products.jsx
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/Products.jsx')
          s = p.read_text()

          old = "import PageTour from '@/components/shared/PageTour'"
          new = old + "\nimport ProductImageUpload from '@/components/catalog/ProductImageUpload'"
          if "ProductImageUpload from '@/components/catalog/ProductImageUpload'" not in s:
              s = s.replace(old, new, 1)

          old = "  readOnly = false,\n}) {"
          new = "  readOnly = false,\n  ownerRef,\n}) {"
          if "  ownerRef,\n}) {" not in s:
              s = s.replace(old, new, 1)

          old = '''              <div><Label>Imagen (URL)</Label><Input value={form.image_url} onChange={(event) => update('image_url', event.target.value)} /></div>'''
          new = '''              <ProductImageUpload\n                value={form.image_url}\n                onChange={(value) => update('image_url', value)}\n                ownerRef={ownerRef}\n                readOnly={readOnly}\n              />'''
          if old not in s and '<ProductImageUpload' not in s:
              raise SystemExit('No se encontró el campo Imagen (URL) esperado')
          s = s.replace(old, new, 1)

          old = '''          readOnly={catalogDialog.mode === 'view' || !canWrite}\n        />'''
          new = '''          readOnly={catalogDialog.mode === 'view' || !canWrite}\n          ownerRef={writeOwnerId || writeOwnerEmail || ownerId || ownerEmail}\n        />'''
          if 'ownerRef={writeOwnerId || writeOwnerEmail || ownerId || ownerEmail}' not in s:
              if old not in s:
                  raise SystemExit('No se encontró el cierre de CatalogDialog esperado')
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/patch-product-image-upload.yml
      - name: Commit patch
        run: |
          git config user.name "CEO Rentable Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/Products.jsx .github/workflows/patch-product-image-upload.yml
          git commit -m "feat: enable product image uploads" || exit 0
          git push
