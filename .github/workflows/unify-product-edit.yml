name: Unify product edit experience
on:
  push:
    paths:
      - '.github/workflows/unify-product-edit.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unify edit action
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/pages/Products.jsx')
          s = p.read_text()
          pattern = re.compile(r'''\s*<Button variant="outline" size="sm" className="h-8" onClick=\{\(\) => openEditProduct\(product\)\}>\s*<Pencil[^>]+/>\s*Básico\s*</Button>\s*<Button variant="outline" size="sm" className="h-8" onClick=\{\(\) => setCatalogDialog\(\{ mode: 'edit', item: product \}\)\}>\s*<Calculator[^>]+/>\s*Costos\s*</Button>''', re.S)
          match = pattern.search(s)
          if not match:
            raise SystemExit('Expected product action block not found')
          replacement = '''\n                          <Button variant="outline" size="sm" className="h-8" onClick={() => setCatalogDialog({ mode: 'edit', item: product })}>
                            <Pencil className="h-3.5 w-3.5 mr-1.5" /> Editar
                          </Button>'''
          s = s[:match.start()] + replacement + s[match.end():]
          p.write_text(s)
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/unify-product-edit.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Products.jsx .github/workflows/unify-product-edit.yml
          git commit -m "fix: use full catalog form for product editing"
          git push