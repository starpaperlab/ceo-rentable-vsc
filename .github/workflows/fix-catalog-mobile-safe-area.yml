name: Fix catalog mobile safe area
on:
  push:
    paths:
      - '.github/workflows/fix-catalog-mobile-safe-area.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile viewport spacing
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/pages/Products.jsx')
          s=p.read_text()
          old='''    <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/60 sm:items-center sm:p-4">\n      <Card className="flex h-[calc(100dvh-env(safe-area-inset-top))] w-full max-w-4xl flex-col overflow-hidden rounded-none border-0 bg-background sm:h-auto sm:max-h-[92dvh] sm:rounded-xl sm:border">\n        <div className="sticky top-0 z-20 flex shrink-0 items-start justify-between gap-4 border-b bg-background px-4 pb-3 pt-[max(1rem,env(safe-area-inset-top))] sm:p-6 sm:pb-4">'''
          new='''    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 px-2 pb-[max(1rem,env(safe-area-inset-bottom))] pt-[max(3.5rem,env(safe-area-inset-top))] sm:p-4">\n      <Card className="flex h-full w-full max-w-4xl flex-col overflow-hidden rounded-2xl border bg-background shadow-2xl sm:h-auto sm:max-h-[92dvh] sm:rounded-xl">\n        <div className="sticky top-0 z-20 flex shrink-0 items-start justify-between gap-4 border-b bg-background p-4 sm:p-6 sm:pb-4">'''
          if old not in s: raise SystemExit('mobile modal anchor missing')
          s=s.replace(old,new,1)
          old='''        <div className="sticky bottom-0 z-20 flex shrink-0 justify-end gap-2 border-t bg-background px-4 pb-[max(1rem,env(safe-area-inset-bottom))] pt-3 sm:p-6 sm:pt-4">'''
          new='''        <div className="sticky bottom-0 z-20 flex shrink-0 justify-end gap-2 border-t bg-background p-4 sm:p-6 sm:pt-4">'''
          if old not in s: raise SystemExit('footer anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)
      - name: Remove temporary workflow
        shell: python
        run: |
          from pathlib import Path
          Path('.github/workflows/fix-catalog-mobile-safe-area.yml').unlink()
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep catalog modal fully visible on iPhone" || exit 0
          git push